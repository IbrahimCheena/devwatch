name: Scripts CI

on:
  push:
    paths:
      - 'scripts/**'
    branches:
      - main
  pull_request:
    paths:
      - 'scripts/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check imports
        run: python -c "import analyze_repo; import coverage_tracker; import generate_report; print('All scripts OK')"
        working-directory: scripts

      - name: Run pylint
        run: pylint scripts/ --disable=C0114,C0115,C0116,C0301,W0611 || true
